<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retrokonwersja PBL – wyniki</title>
<style>
  :root { --bg:#fbfaf7; --fg:#1d1d1b; --muted:#6b6a65; --line:#e3e1da; --card:#fff; --accent:#8a3b12; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#181816; --fg:#ecebe6; --muted:#9a998f; --line:#33322e; --card:#22221f; --accent:#e39b6b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header, main { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 28px; }
  h1 { font: 600 22px/1.2 Georgia, serif; margin: 0 0 4px; }
  header p { margin: 0 0 18px; color: var(--muted); }
  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:12px 0; border-block:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:1; }
  select, input, button { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:6px 10px; }
  input[type=search] { flex: 1 1 220px; }
  button { cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
  .legend { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0; }
  .legend button { font-size:12px; padding:3px 8px; border-radius:999px; }
  .legend button[aria-pressed=true] { outline:2px solid var(--fg); }
  .stats { color:var(--muted); font-size:13px; margin:6px 0 12px; }
  ol { list-style:none; padding:0; margin:0; }
  li { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; }
  .meta { font-size:12px; color:var(--muted); margin-bottom:4px; display:flex; gap:8px; flex-wrap:wrap; }
  .chip { border:1px solid var(--line); border-radius:999px; padding:0 7px; }
  mark { border-radius:3px; padding:0 2px; color:inherit; background:color-mix(in srgb, var(--c) 28%, transparent); box-shadow: inset 0 -2px 0 var(--c); }
  mark::after { content: attr(data-l); font-size:10px; color:var(--c); margin-left:3px; vertical-align: super; }
  .pager { display:flex; gap:8px; align-items:center; justify-content:center; margin:16px 0 40px; }
</style>
</head>
<body>
<header>
  <h1>Retrokonwersja „Polskiej Bibliografii Literackiej” – wyniki parsowania</h1>
  <p>Rekordy bibliograficzne z rozpoznanymi elementami opisu. Kliknij etykietę, aby pokazać tylko rekordy, które ją zawierają.</p>
</header>
<main>
  <div class="controls">
    <label>Rocznik <select id="year"></select></label>
    <input type="search" id="q" placeholder="Szukaj w rekordach…">
    <label><input type="checkbox" id="empty"> tylko bez rozpoznanych elementów</label>
  </div>
  <div class="legend" id="legend"></div>
  <div class="stats" id="stats">Ładowanie…</div>
  <ol id="list"></ol>
  <div class="pager">
    <button id="prev">←</button><span id="page"></span><button id="next">→</button>
  </div>
</main>
<script>
const PAGE = 50;
const COLORS = ['#d64545','#3b82c4','#2e9e5b','#c99a12','#9b59b6','#16a3a3','#e07b39','#7f8c9a','#c2185b','#6d6dd6','#7fa832','#a0522d'];
const $ = id => document.getElementById(id);
let data = null, active = new Set(), filtered = [], page = 0;

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nice = l => l.toLowerCase().replaceAll('_', ' ');

function highlight(text, ents) {
  let out = '', pos = 0;
  for (const [s, e, i] of ents) {
    if (s < pos) continue;  // nakładające się encje pomijamy
    out += esc(text.slice(pos, s)) +
      `<mark style="--c:${COLORS[i % COLORS.length]}" data-l="${esc(nice(data.labels[i]))}">${esc(text.slice(s, e))}</mark>`;
    pos = e;
  }
  return out + esc(text.slice(pos));
}

function apply() {
  const q = $('q').value.trim().toLowerCase(), onlyEmpty = $('empty').checked;
  filtered = data.rows.filter(([, text, ents]) =>
    (!q || text.toLowerCase().includes(q)) &&
    (!onlyEmpty || ents.length === 0) &&
    [...active].every(i => ents.some(e => e[2] === i)));
  page = 0;
  render();
}

function render() {
  const pages = Math.max(1, Math.ceil(filtered.length / PAGE));
  $('stats').textContent = `${filtered.length.toLocaleString('pl')} z ${data.rows.length.toLocaleString('pl')} rekordów`;
  $('list').innerHTML = filtered.slice(page * PAGE, (page + 1) * PAGE).map(([nr, text, ents, flags]) =>
    `<li><div class="meta">${nr != null ? `<span>całostka ${nr}</span>` : ''}${flags.map(f => `<span class="chip">${f}</span>`).join('')}</div>${highlight(text, ents)}</li>`
  ).join('');
  $('page').textContent = `${page + 1} / ${pages}`;
  $('prev').disabled = page === 0;
  $('next').disabled = page >= pages - 1;
}

async function load(year) {
  $('stats').textContent = 'Ładowanie…';
  data = await (await fetch(`data/${encodeURIComponent(year)}.json`)).json();
  const counts = data.labels.map((_, i) => data.rows.reduce((n, r) => n + r[2].filter(e => e[2] === i).length, 0));
  active.clear();
  $('legend').innerHTML = data.labels.map((l, i) =>
    `<button data-i="${i}" aria-pressed="false" style="border-color:${COLORS[i % COLORS.length]};color:${COLORS[i % COLORS.length]}">${esc(nice(l))} · ${counts[i].toLocaleString('pl')}</button>`
  ).join('');
  history.replaceState(null, '', `#${year}`);
  apply();
}

$('legend').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  const i = +b.dataset.i;
  active.has(i) ? active.delete(i) : active.add(i);
  b.setAttribute('aria-pressed', active.has(i));
  apply();
};
let t; $('q').oninput = () => { clearTimeout(t); t = setTimeout(apply, 200); };
$('empty').onchange = apply;
$('prev').onclick = () => { page--; render(); scrollTo(0, 0); };
$('next').onclick = () => { page++; render(); scrollTo(0, 0); };
$('year').onchange = () => load($('year').value);

fetch('data/index.json').then(r => r.json()).then(years => {
  $('year').innerHTML = years.map(y => `<option>${esc(y)}</option>`).join('');
  const start = decodeURIComponent(location.hash.slice(1));
  if (years.includes(start)) $('year').value = start;
  load($('year').value);
});
</script>
</body>
</html>
